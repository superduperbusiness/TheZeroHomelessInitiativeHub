name: ☁️ AWS S3 + CloudFront — Document Storage & CDN

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/**'

jobs:
  sync-to-s3:
    name: Sync Public Assets to S3 + Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sync public assets to S3
        run: |
          aws s3 sync apps/web/public/ s3://zero-hub-documents/public/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} \
            --paths "/public/*"

      - name: Done
        run: echo "✅ S3 + CloudFront synced for zerofoundationusa.org"
