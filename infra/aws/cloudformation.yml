AWSTemplateFormatVersion: '2010-09-09'
Description: Zero Homeless Initiative Hub — S3 + CloudFront + IAM Infrastructure

Parameters:
  DomainName:
    Type: String
    Default: zerofoundationusa.org
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]

Resources:
  # ─── S3 Document Storage Bucket ───────────────────────────
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub zero-hub-documents-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins:
              - !Sub https://${DomainName}
              - !Sub https://www.${DomainName}
              - http://localhost:3000
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ─── S3 Public Assets Bucket (images, logos) ──────────────
  PublicAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub zero-hub-public-${Environment}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  PublicAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicAssetsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${PublicAssetsBucket}/*

  # ─── CloudFront Distribution ───────────────────────────────
  CDNDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Zero Hub CDN — ${DomainName}
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Aliases:
          - !Sub cdn.${DomainName}
        Origins:
          - Id: S3PublicAssets
            DomainName: !GetAtt PublicAssetsBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3PublicAssets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
          Compress: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SSLCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # ─── ACM SSL Certificate ───────────────────────────────────
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub cdn.${DomainName}
      ValidationMethod: DNS
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'

  # ─── IAM Role for App (Firebase Functions / Lambda) ────────
  AppServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub zero-hub-app-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DocumentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentsBucket.Arn
                  - !Sub ${DocumentsBucket.Arn}/*

  # ─── IAM User for GitHub Actions CI/CD ────────────────────
  GithubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub zero-hub-github-actions-${Environment}
      Policies:
        - PolicyName: S3SyncAndCloudFrontInvalidate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt PublicAssetsBucket.Arn
                  - !Sub ${PublicAssetsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CDNDistribution}

Outputs:
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
    Export:
      Name: ZeroHubDocumentsBucket

  PublicAssetsBucketName:
    Value: !Ref PublicAssetsBucket
    Export:
      Name: ZeroHubPublicAssets

  CloudFrontDomain:
    Value: !GetAtt CDNDistribution.DomainName
    Export:
      Name: ZeroHubCDNDomain

  CloudFrontDistributionId:
    Value: !Ref CDNDistribution
    Export:
      Name: ZeroHubCDNDistributionId
